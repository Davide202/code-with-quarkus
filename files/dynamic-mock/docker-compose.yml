version: '3.8'

services:
  dynamic-mock:
    image: davidedinnocente/dynamic-mock:1.0.0
    container_name: mms-mock-api
    ports:
      - "8082:8080"
    environment:
      # Indichiamo all'app dove trovare il file all'interno del container
      - MOCK_ROUTES_FILE=/app/config/routes.json
      - MOCK_TOKEN_REGEX=.*token.*
      - MOCK_JWT_PRIVATE_
    volumes:
      # Montiamo il file routes.json dal tuo host al path previsto nel container in sola lettura (ro)
      - ./routes.json:/app/config/routes.json:ro
    restart: unless-stopped
    #healthcheck:
    #  # Usiamo wget in modalità "spider" (verifica solo che risponda 200 OK)
    #  # Il tuo fallback sulla root '/' o qualsiasi path restituirà HTTP 200
    #  test: [ "CMD-SHELL", "wget -q --spider http://localhost:8080/ || exit 1" ]
    #  interval: 2s
    #  timeout: 2s
    #  retries: 15