services:
  # 1. Database MariaDB
  mariadb:
    image: mariadb:10.11
    container_name: mms-mariadb
    environment:
      MYSQL_ROOT_PASSWORD: Ihbinf-RooT745
      MYSQL_DATABASE: ihbinf-infomobilityconfiguration-db-infoschedulemysql
    ports:
      - "43306:3306"
    volumes:
      - mariadb_data:/var/lib/mysql
    healthcheck:
      test: [ "CMD", "healthcheck.sh", "--connect", "--innodb_initialized" ]
      interval: 10s
      timeout: 5s
      retries: 5

  # 2. Kafka (Immagine ufficiale Apache)
  kafka:
    image: apache/kafka:3.7.0
    container_name: mms-kafka
    ports:
      - "9092:9092"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://0.0.0.0:9092,CONTROLLER://0.0.0.0:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      #socket.request.max.bytes in server.properties
      SOCKET_REQUEST_MAX_BYTES: 1000000000
      KAFKA_SOCKET_REQUEST_MAX_BYTES: 1000000000
    volumes:
      - kafka_data:/var/lib/kafka/data

  # 2b. Script automatico per la creazione dei topic Kafka
  kafka-init:
    image: apache/kafka:3.7.0
    container_name: mms-kafka-init
    depends_on:
      - kafka
    # Esegue un loop in attesa che il broker Kafka sia pronto, poi crea il topic
    command: |
      bash -c "
      echo 'In attesa che Kafka accetti connessioni...'
      until /opt/kafka/bin/kafka-topics.sh --bootstrap-server kafka:9092 --list > /dev/null 2>&1; do
        sleep 2
      done
      echo 'Kafka è pronto! Creazione dei topic in corso...'
      /opt/kafka/bin/kafka-topics.sh --create --if-not-exists --topic tkt-mms-cua-evlout-transaction --bootstrap-server kafka:9092 --partitions 1 --replication-factor 1
      /opt/kafka/bin/kafka-topics.sh --create --if-not-exists --topic ihbtkt-medialifecycle-evl-mediain --bootstrap-server kafka:9092 --partitions 1 --replication-factor 1
      /opt/kafka/bin/kafka-topics.sh --create --if-not-exists --topic tkt-mms-cua-evlin-transaction --bootstrap-server kafka:9092 --partitions 1 --replication-factor 1
      echo 'Inizializzazione Kafka completata.'
      "

  # 3. Elasticsearch
  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:7.17.10
    container_name: mms-elasticsearch
    environment:
      - discovery.type=single-node
      - xpack.security.enabled=false
      - "ES_JAVA_OPTS=-Xms512m -Xmx512m"
    ports:
      - "9200:9200"
    volumes:
      - es_data:/usr/share/elasticsearch/data

  # 4. Cassandra (Database Principale)
  cassandra:
    image: cassandra:4.1
    container_name: mms-cassandra
    environment:
      CASSANDRA_CLUSTER_NAME: "MMSCluster"
      CASSANDRA_DC: "datacenter1"
      CASSANDRA_USER: "cassandra"
      CASSANDRA_PASSWORD: "cassandra"
    ports:
      - "9042:9042"
    volumes:
      - cassandra_data:/var/lib/cassandra
    healthcheck:
      # Verifica la salute eseguendo un comando CQL interno
      test: [ "CMD", "cqlsh", "-u", "cassandra", "-p", "cassandra", "-e", "describe keyspaces" ]
      interval: 15s
      timeout: 10s
      retries: 10

  # 4b. Script automatico per la creazione del Keyspace Cassandra
  cassandra-init:
    image: cassandra:4.1
    container_name: mms-cassandra-init
    depends_on:
      cassandra:
        condition: service_healthy
    command:
      - /bin/bash
      - -c
      - |
        sleep 10
        cqlsh cassandra 9042 -u cassandra -p cassandra -e "CREATE KEYSPACE IF NOT EXISTS ihbtkt_customeractivity_ks_customeractivity WITH replication = {'class': 'SimpleStrategy', 'replication_factor': 1};"
        
        

  # 5. La tua Applicazione Quarkus
  app:
    build:
      context: .
      dockerfile: src/main/docker/Dockerfile.native
    image: prc-transactionconsumer:latest
    container_name: prc-transactionconsumer
    ports:
      - "8080:8080"
    depends_on:
      mariadb:
        condition: service_healthy
      kafka:
        condition: service_started
      kafka-init:
        condition: service_completed_successfully
      elasticsearch:
        condition: service_started
      cassandra:
        condition: service_healthy
      cassandra-init:
        condition: service_completed_successfully # Aspetta che lo script abbia finito prima di avviare Quarkus
      jaeger:
        condition: service_started # Assicura che Jaeger sia avviato prima dell'app
    env_file: "ihbtkt-customeractivity-prc-transactionconsumer.envfile"
    environment:
      # --- FIX 1: Connessione al DB MariaDB ---
      # - QUARKUS_DATASOURCE_JDBC_URL=jdbc:mariadb://mariadb:3306/ihbinf-infomobilityconfiguration-db-infoschedulemysql?verifyServerCertificate=false&useSSL=false&useLegacyDatetimeCode=false&serverTimezone=UTC
      # - QUARKUS_DATASOURCE_USERNAME=root
      # - QUARKUS_DATASOURCE_PASSWORD=Ihbinf-RooT745

      # --- FIX 2: Correzione espressione CRON ---
      - MOOVA_IHBINF_INFOMOBILITYCONFIGURATION_API_CONFIGURATIONINFOSCHEDULES_SERVER_SIGNAL_LOGS_CRON_EXPRESSION=0/30 * * * * ?

      # Configurazione Kafka ed Elasticsearch
      - MOOVA_FND_APPLICATIONMONITORING_EVL_SIGNALKEEPALIVE_KAFKA_BOOTSTRAP_SERVERS=kafka:9092
      - MOOVA_IHBINF_INFOMOBILITYCONFIGURATION_EVL_ONGROUNDINFOSCHEDULE_KAFKA_BOOTSTRAP_SERVERS=kafka:9092
      - FND_CORE_LIB_QUARKUS_ELASTICSEARCH_HOST=elasticsearch
      - FND_CORE_LIB_QUARKUS_ELASTICSEARCH_PORT=9200

      # --- FIX 3: Configurazione Cassandra ---
      - MOOVA_IHBTKT_CUSTOMERACTIVITY_KS_CAD_CASSANDRA_USER=cassandra
      - MOOVA_IHBTKT_CUSTOMERACTIVITY_KS_CAD_CASSANDRA_PASSWORD=cassandra
      - MOOVA_IHBTKT_CUSTOMERACTIVITY_KS_CAD_CASSANDRA_HOST=cassandra
      - MOOVA_IHBTKT_CUSTOMERACTIVITY_KS_CAD_CASSANDRA_PORT=9042
      - MOOVA_IHBTKT_CUSTOMERACTIVITY_KS_CAD_CASSANDRA_DATACENTER=datacenter1

      # Disabilita tenant OIDC
      - QUARKUS_OIDC_TENANT_ENABLED=false
      - QUARKUS_HIBERNATE_ORM_DATABASE_GENERATION=update

      #- QUARKUS_OTEL_EXPORTER_OTLP_TRACES_ENABLED=false
      - QUARKUS_OTEL_EXPORTER_OTLP_TRACES_ENDPOINT=http://jaeger:4317

      # --- VARIABILI ESTRATTE DA application.yaml ---

      # Core & Log
      - LOG_LEVEL_NETWORKCONSUMER=DEBUG
      - MOOVA_IHBTKT_CUSTOMERACTIVITY_PRC_NETWORKCONSUMER_SERVER_PORT=8080
      - MOOVA_IHBTKT_CUSTOMERACTIVITY_PRC_NETWORKCONSUMER_LOGGING_INTERVAL=1000

      # Observability (OpenTelemetry / Jaeger)
      - DEPLOYMENT_LANE=quarkus
      - OTEL_EXPORTER_OTLP_ENDPOINT=http://jaeger:4317

      # Kafka Consumer
      - MOOVA_IHBTKT_CUSTOMERACTIVITY_PRC_NETWORKCONSUMERIN_KAFKA_BOOTSTRAP_SERVERS=kafka:9092
      - MOOVA_IHBTKT_CUSTOMERACTIVITY_EVL_TRANSACTION_KAFKA_HOST=kafka:9092
      - MOOVA_IHBTKT_CUSTOMERACTIVITY_PRC_NETWORKCONSUMERIN_KAFKA_CONSUMER_SECURITY_PROTOCOL=PLAINTEXT

      # Parametri Kafka da valorizzare (nessun default in yaml)
      - MOOVA_IHBTKT_CUSTOMERACTIVITY_PRC_NETWORKCONSUMERIN_KAFKA_CONSUMER_TOPIC_NAME=inserisci_nome_topic
      - MOOVA_IHBTKT_CUSTOMERACTIVITY_PRC_NETWORKCONSUMERIN_KAFKA_CONSUMER_GROUP_ID=inserisci_group_id
      - MOOVA_IHBTKT_CUSTOMERACTIVITY_PRC_NETWORKCONSUMERIN_KAFKA_CONSUMER_CLIENT_ID=inserisci_client_id

      # Parametri SASL/SSL esposti in yaml ma opzionali (lasciati vuoti se non usati in PLAINTEXT)
      - MOOVA_IHBTKT_CUSTOMERACTIVITY_PRC_NETWORKCONSUMERIN_KAFKA_CONSUMER_SASL_MECHANISM=
      - MOOVA_IHBTKT_CUSTOMERACTIVITY_PRC_NETWORKCONSUMERIN_KAFKA_CONSUMER_SASL_JAAS_CONFIG=
      - MOOVA_IHBTKT_CUSTOMERACTIVITY_PRC_NETWORKCONSUMERIN_CONSUMER_SSL_ENDPOINT_IDENTIFICATION_ALGORITHM=
      - MOOVA_IHBTKT_CUSTOMERACTIVITY_API_SERIAL_GENERATOR_START_DATE_UTC=2026-06-10T00:00:00.000Z
      - MOOVA_FND_CORE_LIB_SPRING_SECURITY_CACHE_CRON=0 0 23 ? * MON

      # --- CONSUMER ---
      - MOOVA_IHBTKT_CUSTOMERACTIVITY_EVL_TRANSACTION_KAFKA_CONSUMER_SECURITY_PROTOCOL=PLAINTEXT
      - MOOVA_IHBTKT_CUSTOMERACTIVITY_EVL_TRANSACTION_KAFKA_CONSUMER_SASL_MECHANISM=
      - MOOVA_IHBTKT_CUSTOMERACTIVITY_EVL_TRANSACTION_KAFKA_CONSUMER_SASL_JAAS_CONFIG=

      # --- PRODUCER ---
      - MOOVA_IHBTKT_CUSTOMERACTIVITY_EVL_TRANSACTION_KAFKA_PRODUCER_SECURITY_PROTOCOL=PLAINTEXT
      - MOOVA_IHBTKT_CUSTOMERACTIVITY_EVL_TRANSACTION_KAFKA_PRODUCER_SASL_MECHANISM=
      - MOOVA_IHBTKT_CUSTOMERACTIVITY_EVL_TRANSACTION_KAFKA_PRODUCER_SASL_JAAS_CONFIG=

      # --- APPLICATION LOGS (se usato localmente) ---
      - MOOVA_FND_INSTRUMENTATION_EVL_APPLICATIONSLOGS_KAFKA_SECURITY_PROTOCOL=PLAINTEXT
      - MOOVA_FND_INSTRUMENTATION_EVL_APPLICATIONSLOGS_KAFKA_SASL_MECHANISM=
      - MOOVA_FND_INSTRUMENTATION_EVL_APPLICATIONSLOGS_KAFKA_SASL_JAAS_CONFIG=


  # 6. Jaeger (Collector OpenTelemetry)
  jaeger:
    image: jaegertracing/all-in-one:latest
    container_name: mms-jaeger
    environment:
      - COLLECTOR_OTLP_ENABLED=true
    ports:
      - "16686:16686" # Interfaccia Web di Jaeger
      - "4317:4317" # Porta gRPC dove Quarkus invia i log (quella che ora va in "Connection refused")

volumes:
  mariadb_data:
  kafka_data:
  es_data:
  cassandra_data:

    #  mvn clean package  -Dnative  "-Dquarkus.native.native-image-xmx=8g" "-Dquarkus.native.container-build=true"
    # docker compose up -d
